[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-plugin-sdk"
version = "0.1.0"
description = "Shared local control and reporting SDK for Feishu plugins"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["feishu_plugin_sdk*"]
